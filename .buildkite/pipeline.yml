steps:
  - label: ":lint-roller: Pylint Code Check"
    key: "pylint"
    command: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pylint
      
      # Create logs directory
      mkdir -p logs
      
      # Run pylint and save output to log files
      # Save as text format
      pylint $(git ls-files '*.py') | tee logs/pylint-report.txt
      
      # Store exit code
      PYLINT_EXIT_CODE=${PIPESTATUS[0]}
      
      # Also save as JSON format for easier parsing
      pylint $(git ls-files '*.py') --output-format=json > logs/pylint-report.json || true
      
      # Save colorized output (if you want ANSI colors preserved)
      pylint $(git ls-files '*.py') --output-format=colorized > logs/pylint-report-color.txt || true
      
      # Return the exit code from the first pylint run
      exit $PYLINT_EXIT_CODE
    plugins:
      - docker#v5.11.0:
          image: "python:3.10"
          workdir: /app
          mount-buildkite-agent: true
          propagate-environment: true
    artifact_paths:
      - "logs/*.txt"
      - "logs/*.json"
