steps:
  - label: ":lint-roller: Pylint Code Check"
    key: "pylint"
    command: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pylint
      pylint $(git ls-files '*.py')
    plugins:
      - docker#v5.11.0:
          image: "python:3.10"
          workdir: /app
