steps:
  - label: ":lint-roller: Pylint Code Check"
    key: "pylint"
    command: |
      # Install dependencies
      python3 -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pylint
      
      # Create logs directory
      mkdir -p logs
      
      # Run pylint and save output to log files
      echo "Running pylint and saving results..."
      
      # Save as text format (with tee to see output)
      pylint $(git ls-files '*.py') 2>&1 | tee logs/pylint-report.txt
      
      # Store exit code
      PYLINT_EXIT_CODE=${PIPESTATUS[0]}
      
      # Also save as JSON format for easier parsing
      pylint $(git ls-files '*.py') --output-format=json > logs/pylint-report.json 2>&1 || true
      
      # Save colorized output (if you want ANSI colors preserved)
      pylint $(git ls-files '*.py') --output-format=colorized > logs/pylint-report-color.txt 2>&1 || true
      
      # Create a summary file
      echo "Pylint check completed at $(date)" > logs/summary.txt
      echo "Exit code: $PYLINT_EXIT_CODE" >> logs/summary.txt
      echo "Files checked: $(git ls-files '*.py' | wc -l)" >> logs/summary.txt
      
      # List generated files for verification
      echo "Generated log files:"
      ls -lh logs/
      
      # Return the exit code from the first pylint run
      exit $PYLINT_EXIT_CODE
    artifact_paths:
      - "logs/**/*"
