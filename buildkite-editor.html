<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buildkite Pipeline YAML Editor 🚀</title>
    <meta name="description" content="Visual editor for Buildkite pipeline YAML configurations">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00e5a0;
            --primary-dark: #00c689;
            --secondary-color: #6366f1;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #10b981;
            --bg-dark: #0a0e1a;
            --bg-card: #151b2e;
            --bg-card-hover: #1a2235;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #293548;
            --shadow-glow: rgba(0, 229, 160, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #0f1729 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-header {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(0, 229, 160, 0.1) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-icon {
            font-size: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .editor-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        @media (max-width: 1200px) {
            .editor-layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 8px 30px var(--shadow-glow);
            border-color: var(--primary-color);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: var(--bg-dark);
            box-shadow: 0 4px 20px rgba(0, 229, 160, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 229, 160, 0.4);
        }

        .btn-secondary {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
            transform: translateY(-2px);
        }

        .btn-icon {
            background: rgba(99, 102, 241, 0.1);
            color: var(--secondary-color);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 0.5rem;
            border-radius: 8px;
        }

        .btn-icon:hover {
            background: rgba(99, 102, 241, 0.2);
            transform: scale(1.1);
        }

        .step-form {
            display: grid;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        input, textarea, select {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.875rem 1rem;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 229, 160, 0.1);
        }

        textarea {
            font-family: 'Fira Code', monospace;
            resize: vertical;
            min-height: 120px;
        }

        .steps-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        .step-item {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            transition: all 0.3s ease;
            cursor: grab;
        }

        .step-item:hover {
            border-color: var(--primary-color);
            box-shadow: 0 4px 20px var(--shadow-glow);
        }

        .step-item.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .step-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .step-label {
            font-weight: 600;
            font-size: 1rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .step-actions {
            display: flex;
            gap: 0.5rem;
        }

        .step-details {
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: grid;
            gap: 0.5rem;
        }

        .step-key {
            display: inline-block;
            background: rgba(99, 102, 241, 0.1);
            color: var(--secondary-color);
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-family: 'Fira Code', monospace;
        }

        .yaml-output {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            overflow-x: auto;
            white-space: pre;
            color: var(--text-primary);
            max-height: 600px;
            overflow-y: auto;
        }

        .yaml-output::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .yaml-output::-webkit-scrollbar-track {
            background: var(--bg-card);
            border-radius: 4px;
        }

        .yaml-output::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .yaml-output::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
        }

        .notification {
            position: fixed;
            top: 100px;
            right: 2rem;
            background: linear-gradient(135deg, var(--success-color) 0%, #059669 100%);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
        }

        .notification.show {
            transform: translateX(0);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .tag-command {
            background: rgba(0, 229, 160, 0.1);
            color: var(--primary-color);
        }

        .tag-block {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning-color);
        }

        .syntax-key { color: #8be9fd; }
        .syntax-value { color: #50fa7b; }
        .syntax-string { color: #f1fa8c; }
        .syntax-comment { color: #6272a4; font-style: italic; }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🚀</span>
                <h1>Buildkite Pipeline Editor</h1>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="loadExample()">
                    📋 Load Example
                </button>
                <button class="btn btn-secondary" onclick="clearAll()">
                    🗑️ Clear All
                </button>
                <button class="btn btn-primary" onclick="downloadYAML()">
                    ⬇️ Download YAML
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="editor-layout">
            <!-- Step Builder -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        ✨ Step Builder
                    </h2>
                </div>
                
                <form class="step-form" onsubmit="addStep(event)">
                    <div class="form-group">
                        <label>📝 Step Type</label>
                        <select id="stepType" onchange="updateFormFields()">
                            <option value="command">Command Step</option>
                            <option value="block">Block Step (Manual Approval)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>🏷️ Label (with emoji!)</label>
                        <input type="text" id="stepLabel" placeholder="e.g., :rocket: Deploy to Production" required>
                    </div>

                    <div class="form-group">
                        <label>🔑 Key (unique identifier)</label>
                        <input type="text" id="stepKey" placeholder="e.g., deploy-prod">
                    </div>

                    <div class="form-group" id="commandGroup">
                        <label>⚡ Command</label>
                        <textarea id="stepCommand" placeholder="echo 'Hello World'&#10;npm install&#10;npm test"></textarea>
                    </div>

                    <div class="form-group" id="promptGroup" style="display: none;">
                        <label>💬 Approval Prompt</label>
                        <input type="text" id="stepPrompt" placeholder="e.g., Deploy to production?">
                    </div>

                    <div class="form-group">
                        <label>🔗 Depends On (comma-separated keys)</label>
                        <input type="text" id="stepDependsOn" placeholder="e.g., test, lint">
                    </div>

                    <div class="form-group">
                        <label>🐳 Docker Image (optional)</label>
                        <input type="text" id="dockerImage" placeholder="e.g., python:3.14">
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        ➕ Add Step
                    </button>
                </form>

                <!-- Steps List -->
                <div style="margin-top: 2rem;">
                    <h3 class="card-title">📋 Pipeline Steps</h3>
                    <div id="stepsList" class="steps-list">
                        <div class="empty-state">
                            <div class="empty-state-icon">📦</div>
                            <p>No steps yet. Add your first step above!</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- YAML Preview -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        📄 YAML Output
                    </h2>
                    <button class="btn btn-icon" onclick="copyYAML()" title="Copy to clipboard">
                        📋
                    </button>
                </div>
                
                <div id="yamlOutput" class="yaml-output">
<span class="syntax-comment"># No steps defined yet</span>
<span class="syntax-key">steps</span>: []
                </div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification">
        <span id="notificationIcon">✅</span>
        <span id="notificationText">Success!</span>
    </div>

    <script>
        let steps = [];

        function updateFormFields() {
            const stepType = document.getElementById('stepType').value;
            const commandGroup = document.getElementById('commandGroup');
            const promptGroup = document.getElementById('promptGroup');
            
            if (stepType === 'block') {
                commandGroup.style.display = 'none';
                promptGroup.style.display = 'block';
                document.getElementById('stepCommand').removeAttribute('required');
            } else {
                commandGroup.style.display = 'block';
                promptGroup.style.display = 'none';
                document.getElementById('stepPrompt').removeAttribute('required');
            }
        }

        function addStep(event) {
            event.preventDefault();
            
            const stepType = document.getElementById('stepType').value;
            const label = document.getElementById('stepLabel').value;
            const key = document.getElementById('stepKey').value;
            const command = document.getElementById('stepCommand').value;
            const prompt = document.getElementById('stepPrompt').value;
            const dependsOn = document.getElementById('stepDependsOn').value;
            const dockerImage = document.getElementById('dockerImage').value;

            const step = {
                type: stepType,
                label: label,
                key: key || generateKey(label),
            };

            if (stepType === 'command') {
                step.command = command;
            } else if (stepType === 'block') {
                step.prompt = prompt || 'Continue?';
            }

            if (dependsOn) {
                step.depends_on = dependsOn.split(',').map(s => s.trim());
            }

            if (dockerImage && stepType === 'command') {
                step.plugins = {
                    docker: {
                        image: dockerImage,
                        workdir: '/app'
                    }
                };
            }

            steps.push(step);
            updateStepsList();
            updateYAML();
            
            // Reset form
            document.getElementById('stepLabel').value = '';
            document.getElementById('stepKey').value = '';
            document.getElementById('stepCommand').value = '';
            document.getElementById('stepPrompt').value = '';
            document.getElementById('stepDependsOn').value = '';
            document.getElementById('dockerImage').value = '';

            showNotification('✅', 'Step added successfully!');
        }

        function generateKey(label) {
            return label.toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-|-$/g, '');
        }

        function updateStepsList() {
            const stepsList = document.getElementById('stepsList');
            
            if (steps.length === 0) {
                stepsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📦</div>
                        <p>No steps yet. Add your first step above!</p>
                    </div>
                `;
                return;
            }

            stepsList.innerHTML = steps.map((step, index) => `
                <div class="step-item" draggable="true" data-index="${index}">
                    <div class="step-header">
                        <div class="step-label">
                            ${step.type === 'block' ? '🔒' : '⚡'} ${step.label}
                        </div>
                        <div class="step-actions">
                            <button class="btn btn-icon" onclick="moveStepUp(${index})" ${index === 0 ? 'disabled' : ''}>
                                ⬆️
                            </button>
                            <button class="btn btn-icon" onclick="moveStepDown(${index})" ${index === steps.length - 1 ? 'disabled' : ''}>
                                ⬇️
                            </button>
                            <button class="btn btn-icon" onclick="deleteStep(${index})">
                                🗑️
                            </button>
                        </div>
                    </div>
                    <div class="step-details">
                        <div>
                            <span class="tag tag-${step.type === 'block' ? 'block' : 'command'}">
                                ${step.type}
                            </span>
                            <span class="step-key">${step.key}</span>
                        </div>
                        ${step.command ? `<div>📝 ${step.command.split('\n')[0]}${step.command.split('\n').length > 1 ? '...' : ''}</div>` : ''}
                        ${step.prompt ? `<div>💬 "${step.prompt}"</div>` : ''}
                        ${step.depends_on ? `<div>🔗 Depends on: ${step.depends_on.join(', ')}</div>` : ''}
                        ${step.plugins?.docker ? `<div>🐳 ${step.plugins.docker.image}</div>` : ''}
                    </div>
                </div>
            `).join('');

            // Add drag and drop event listeners
            document.querySelectorAll('.step-item').forEach(item => {
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragover', handleDragOver);
                item.addEventListener('drop', handleDrop);
                item.addEventListener('dragend', handleDragEnd);
            });
        }

        function deleteStep(index) {
            steps.splice(index, 1);
            updateStepsList();
            updateYAML();
            showNotification('🗑️', 'Step deleted');
        }

        function moveStepUp(index) {
            if (index > 0) {
                [steps[index], steps[index - 1]] = [steps[index - 1], steps[index]];
                updateStepsList();
                updateYAML();
            }
        }

        function moveStepDown(index) {
            if (index < steps.length - 1) {
                [steps[index], steps[index + 1]] = [steps[index + 1], steps[index]];
                updateStepsList();
                updateYAML();
            }
        }

        // Drag and Drop
        let draggedIndex = null;

        function handleDragStart(e) {
            draggedIndex = parseInt(e.target.getAttribute('data-index'));
            e.target.classList.add('dragging');
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDrop(e) {
            e.preventDefault();
            const dropIndex = parseInt(e.target.closest('.step-item').getAttribute('data-index'));
            
            if (draggedIndex !== null && draggedIndex !== dropIndex) {
                const draggedStep = steps[draggedIndex];
                steps.splice(draggedIndex, 1);
                steps.splice(dropIndex, 0, draggedStep);
                updateStepsList();
                updateYAML();
            }
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            draggedIndex = null;
        }

        function updateYAML() {
            const yamlOutput = document.getElementById('yamlOutput');
            
            if (steps.length === 0) {
                yamlOutput.innerHTML = `<span class="syntax-comment"># No steps defined yet</span>\n<span class="syntax-key">steps</span>: []`;
                return;
            }

            let yaml = 'steps:\n';
            
            steps.forEach(step => {
                yaml += `  - label: "${step.label}"\n`;
                yaml += `    key: "${step.key}"\n`;
                
                if (step.depends_on) {
                    if (step.depends_on.length === 1) {
                        yaml += `    depends_on: "${step.depends_on[0]}"\n`;
                    } else {
                        yaml += `    depends_on:\n`;
                        step.depends_on.forEach(dep => {
                            yaml += `      - "${dep}"\n`;
                        });
                    }
                }
                
                if (step.type === 'command') {
                    if (step.command.includes('\n')) {
                        yaml += `    command: |\n`;
                        step.command.split('\n').forEach(line => {
                            yaml += `      ${line}\n`;
                        });
                    } else {
                        yaml += `    command: "${step.command}"\n`;
                    }
                } else if (step.type === 'block') {
                    yaml += `    prompt: "${step.prompt}"\n`;
                }
                
                if (step.plugins?.docker) {
                    yaml += `    plugins:\n`;
                    yaml += `      - docker#v5.11.0:\n`;
                    yaml += `          image: "${step.plugins.docker.image}"\n`;
                    yaml += `          workdir: "${step.plugins.docker.workdir}"\n`;
                }
                
                yaml += '\n';
            });

            // Syntax highlighting
            yaml = yaml.replace(/^(\s*)([a-z_]+):/gm, '$1<span class="syntax-key">$2</span>:');
            yaml = yaml.replace(/"([^"]*)"/g, '<span class="syntax-string">"$1"</span>');
            yaml = yaml.replace(/#.*/g, '<span class="syntax-comment">$&</span>');
            
            yamlOutput.innerHTML = yaml;
        }

        function copyYAML() {
            let yaml = 'steps:\n';
            
            steps.forEach(step => {
                yaml += `  - label: "${step.label}"\n`;
                yaml += `    key: "${step.key}"\n`;
                
                if (step.depends_on) {
                    if (step.depends_on.length === 1) {
                        yaml += `    depends_on: "${step.depends_on[0]}"\n`;
                    } else {
                        yaml += `    depends_on:\n`;
                        step.depends_on.forEach(dep => {
                            yaml += `      - "${dep}"\n`;
                        });
                    }
                }
                
                if (step.type === 'command') {
                    if (step.command.includes('\n')) {
                        yaml += `    command: |\n`;
                        step.command.split('\n').forEach(line => {
                            yaml += `      ${line}\n`;
                        });
                    } else {
                        yaml += `    command: "${step.command}"\n`;
                    }
                } else if (step.type === 'block') {
                    yaml += `    prompt: "${step.prompt}"\n`;
                }
                
                if (step.plugins?.docker) {
                    yaml += `    plugins:\n`;
                    yaml += `      - docker#v5.11.0:\n`;
                    yaml += `          image: "${step.plugins.docker.image}"\n`;
                    yaml += `          workdir: "${step.plugins.docker.workdir}"\n`;
                }
                
                yaml += '\n';
            });

            navigator.clipboard.writeText(yaml).then(() => {
                showNotification('📋', 'YAML copied to clipboard!');
            });
        }

        function downloadYAML() {
            let yaml = 'steps:\n';
            
            steps.forEach(step => {
                yaml += `  - label: "${step.label}"\n`;
                yaml += `    key: "${step.key}"\n`;
                
                if (step.depends_on) {
                    if (step.depends_on.length === 1) {
                        yaml += `    depends_on: "${step.depends_on[0]}"\n`;
                    } else {
                        yaml += `    depends_on:\n`;
                        step.depends_on.forEach(dep => {
                            yaml += `      - "${dep}"\n`;
                        });
                    }
                }
                
                if (step.type === 'command') {
                    if (step.command.includes('\n')) {
                        yaml += `    command: |\n`;
                        step.command.split('\n').forEach(line => {
                            yaml += `      ${line}\n`;
                        });
                    } else {
                        yaml += `    command: "${step.command}"\n`;
                    }
                } else if (step.type === 'block') {
                    yaml += `    prompt: "${step.prompt}"\n`;
                }
                
                if (step.plugins?.docker) {
                    yaml += `    plugins:\n`;
                    yaml += `      - docker#v5.11.0:\n`;
                    yaml += `          image: "${step.plugins.docker.image}"\n`;
                    yaml += `          workdir: "${step.plugins.docker.workdir}"\n`;
                }
                
                yaml += '\n';
            });

            const blob = new Blob([yaml], { type: 'text/yaml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'pipeline.yml';
            a.click();
            URL.revokeObjectURL(url);
            
            showNotification('⬇️', 'Pipeline downloaded!');
        }

        function loadExample() {
            steps = [
                {
                    type: 'command',
                    label: ':python: Install Dependencies',
                    key: 'install',
                    command: 'python3 -m venv venvironment\nsource venvironment/bin/activate\npip install -r requirements.txt',
                    plugins: {
                        docker: {
                            image: 'python:3.14',
                            workdir: '/app'
                        }
                    }
                },
                {
                    type: 'command',
                    label: ':test_tube: Run Tests',
                    key: 'test',
                    command: 'source venvironment/bin/activate\npytest --cov',
                    depends_on: ['install'],
                    plugins: {
                        docker: {
                            image: 'python:3.14',
                            workdir: '/app'
                        }
                    }
                },
                {
                    type: 'block',
                    label: ':thinking_face: Review & Approve',
                    key: 'approval',
                    prompt: 'Deploy to production?',
                    depends_on: ['test']
                },
                {
                    type: 'command',
                    label: ':rocket: Deploy',
                    key: 'deploy',
                    command: 'echo "Deploying to production..."',
                    depends_on: ['approval']
                }
            ];
            
            updateStepsList();
            updateYAML();
            showNotification('📋', 'Example pipeline loaded!');
        }

        function clearAll() {
            if (steps.length > 0 && !confirm('Are you sure you want to clear all steps?')) {
                return;
            }
            steps = [];
            updateStepsList();
            updateYAML();
            showNotification('🗑️', 'All steps cleared');
        }

        function showNotification(icon, text) {
            const notification = document.getElementById('notification');
            const notificationIcon = document.getElementById('notificationIcon');
            const notificationText = document.getElementById('notificationText');
            
            notificationIcon.textContent = icon;
            notificationText.textContent = text;
            
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Initialize
        updateYAML();
    </script>
</body>
</html>
